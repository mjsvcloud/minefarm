<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>계절별 식물 성장 속도 - 오리진피아</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        .section { margin-bottom: 30px; }
        /* 표의 크기를 작게 조절 (width: 50%) */
        table { width: 50%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; font-size: 1em; height: 20px; }
        th { background-color: #f4f4f4; }
        a { text-decoration: none; color: #3498db; font-size: 1.2em; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>계절</h1>
    
    <div class="section">
        <!-- 사계절 30일 시스템 설명 추가 -->
        <p style="font-size: 1.05em; font-weight: bold; color: #2c3e50; margin-bottom: 10px;">
            사계절 시스템 안내
        </p>
        <p style="color: #555; font-size: 0.95em; line-height: 1.5; margin-top: 0;">
            해당 서버는 봄, 여름, 가을, 겨울로 이루어진 사계절 30일 시스템을 채택하고 있습니다. 각 계절은 마인크래프트 기준 30일(현실 시간 10시간) 동안 지속되며, 계절이 바뀔 때마다 작물의 성장 속도가 달라집니다.
        </p>

        <table>
            <tr>
                <th>계절</th>
                <th>성장 속도</th>
            </tr>
            <tr>
                <td>🌸 봄</td>
                <td>130%</td>
            </tr>
            <tr>
                <td>☀️ 여름</td>
                <td>160%</td>
            </tr>
            <tr>
                <td>🍁 가을</td>
                <td>70%</td>
            </tr>
            <tr>
                <td>❄️ 겨울</td>
                <td>40%</td>
            </tr>
        </table>
        <p style="color: #666; font-size: 0.95em; line-height: 1.6;">
            ※ <strong>참고사항:</strong><br>
            - 100%가 마인크래프트의 기본 작물 성장 속도입니다.<br>
            - 자신의 영지 안에 심어진 작물에만 해당 성장 속도가 적용됩니다.
        </p>
    </div>
    
    <a href="index.html">← 메인으로 돌아가기</a>
</body>
</html>
